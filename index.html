<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#165c3e" />
    <meta
      name="description"
      content="KhaiLife: không gian học tập, lịch học cá nhân và 7 trò Brain Gym."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>KhaiLife — Học tập & Brain Gym</title>
    <link rel="icon" href="assets/icons/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/dashboard.css" />
    <link rel="stylesheet" href="assets/css/schedule.css" />
    <link rel="stylesheet" href="assets/css/aptis.css" />
    <link rel="stylesheet" href="assets/css/brain-gym.css" />
    <link rel="stylesheet" href="assets/css/settings.css" />
    <script defer src="js/core/utils.js"></script>
    <script defer src="js/data/schedule-data.js"></script>
    <script defer src="js/data/aptis-plan.js"></script>
    <script defer src="js/core/store.js"></script>
    <script defer src="js/core/theme.js"></script>
    <script defer src="js/features/tasks.js"></script>
    <script defer src="js/features/schedule.js"></script>
    <script defer src="js/features/aptis.js"></script>
    <script defer src="js/brain/engine.js"></script>
    <script defer src="js/brain/games/schulte.js"></script>
    <script defer src="js/brain/games/stroop.js"></script>
    <script defer src="js/brain/games/sequence.js"></script>
    <script defer src="js/brain/games/auditory.js"></script>
    <script defer src="js/brain/games/mirror.js"></script>
    <script defer src="js/brain/games/logic.js"></script>
    <script defer src="js/brain/games/context.js"></script>
    <script defer src="js/features/brain-gym.js"></script>
    <script defer src="js/features/dashboard.js"></script>
    <script defer src="js/features/github-sync.js"></script>
    <script defer src="js/features/settings.js"></script>
    <script defer src="js/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#content">Đến nội dung</a>
    <button
      class="menu-overlay"
      id="menu-overlay"
      aria-label="Đóng mục lục"
      hidden
    ></button>
    <aside class="sidebar" id="sidebar" aria-label="Mục lục">
      <a class="brand" href="#home"
        ><img
          class="app-logo"
          src="assets/icons/logo.svg"
          alt=""
          width="42"
          height="42"
        /><span
          >KhaiLife<span class="brand-sub">KHÔNG GIAN CỦA KHẢI</span></span
        ></a
      >
      <div class="nav-label">MỖI NGÀY TỐT HƠN</div>
      <nav class="main-nav" id="main-nav"></nav>
      <div class="nav-label">KẾT NỐI NHANH</div>
      <nav class="external-nav">
        <a
          href="https://duckhai.id.vn/hvubank"
          target="_blank"
          rel="noopener noreferrer"
          ><span data-icon="book"></span>HVU Bank<span
            data-icon="external"
            class="end-icon"
          ></span
        ></a>
        <a
          href="https://khaivjp.github.io/thuchi/"
          target="_blank"
          rel="noopener noreferrer"
          ><span data-icon="wallet"></span>Thu chi<span
            data-icon="external"
            class="end-icon"
          ></span
        ></a>
      </nav>
      <div class="sidebar-bottom">
        <div class="small-note">
          <span class="status-dot"></span> Tiến bộ từng chút, mỗi ngày.
        </div>
        <a href="#settings" class="settings-link"
          ><span data-icon="settings"></span>Cài đặt & dữ liệu</a
        >
        <div class="profile">
          <span class="avatar">K</span>
          <div>
            <strong>Khải</strong><small>Học tập. Rèn luyện. Phát triển.</small>
          </div>
          <span class="online-dot"></span>
        </div>
      </div>
    </aside>
    <div class="app-shell">
      <header class="topbar">
        <div class="row">
          <button
            id="menu-toggle"
            class="icon-button mobile-menu"
            aria-label="Mở mục lục"
            aria-expanded="false"
            aria-controls="sidebar"
          >
            <span data-icon="menu"></span></button
          ><span class="breadcrumb"
            >Không gian cá nhân <span>/</span>
            <strong id="route-title">Tổng quan</strong></span
          >
        </div>
        <div class="row">
          <time id="header-date"></time
          ><button
            id="theme-toggle"
            class="icon-button"
            aria-label="Đổi giao diện sáng tối"
          >
            <span data-icon="moon"></span></button
          ><a
            href="#settings"
            class="avatar avatar-small"
            aria-label="Cài đặt tài khoản Khải"
            >K</a
          >
        </div>
      </header>
      <main id="content" tabindex="-1"></main>
      <footer class="app-footer">
        <span
          >KhaiLife
          <span class="muted">/ Một góc nhỏ để tiến xa hơn.</span></span
        ><span>Được làm cho Khải <span class="leaf">✳</span></span>
      </footer>
    </div>
    <nav class="bottom-nav" id="bottom-nav" aria-label="Điều hướng nhanh"></nav>
    <dialog id="dialog"></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <noscript><p>Hãy bật JavaScript để sử dụng KhaiLife.</p></noscript>
  </body>
</html>
