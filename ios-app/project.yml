name: KhaiLife
options:
  bundleIdPrefix: vn.khaivjp
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  KhaiLife:
    type: application
    platform: iOS
    sources:
      - path: Native
        excludes: [UITests]
      - path: Web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.khaivjp.KhaiLife
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: KhaiLife
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Chọn ảnh để đổi biểu tượng cá nhân trong KhaiLife.
        INFOPLIST_KEY_NSCameraUsageDescription: Chụp ảnh để đổi biểu tượng cá nhân trong KhaiLife.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  KhaiLifeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Native/UITests]
    dependencies:
      - target: KhaiLife
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: vn.khaivjp.KhaiLife.UITests
schemes:
  KhaiLife:
    build:
      targets:
        KhaiLife: all
    test:
      targets: [KhaiLifeUITests]
