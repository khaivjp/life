name: Build KhaiLife iOS
on:
  push:
    branches: ['codex/ios-*']
    paths: ['ios-app/**', '.github/workflows/ios-build.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare bundled web apps
        run: node ios-app/scripts/prepare-web.mjs
      - name: Install project generator
        run: brew install xcodegen
      - name: Build device application and IPA
        run: bash ios-app/scripts/build-ios.sh
      - name: Select available iPhone simulator
        id: simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for group in d["devices"].values() for v in group if "iPhone" in v["name"]))')
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
      - name: Smoke test both screens on iOS
        run: |
          xcodebuild -project ios-app/KhaiLife.xcodeproj -scheme KhaiLife \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -derivedDataPath ios-app/build/simulator \
            -resultBundlePath ios-app/build/SmokeTests.xcresult \
            CODE_SIGNING_ALLOWED=NO test
      - name: Upload IPA for sideload signing
        uses: actions/upload-artifact@v4
        with:
          name: KhaiLife-unsigned-IPA
          path: ios-app/build/KhaiLife-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Upload simulator test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-smoke-test-results
          path: ios-app/build/SmokeTests.xcresult
          if-no-files-found: ignore
          retention-days: 7
